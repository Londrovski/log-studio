name: Build and publish

# GitHub Pages can be served two ways, and this works under both.
#
#   "GitHub Actions"        — the deploy job below publishes dist/ (the tidy option)
#   "Deploy from a branch"  — Pages serves the repo as-is, which is missing the files
#                             that only exist after a build. So the build job commits
#                             exactly those back to main, and the repo root becomes a
#                             complete, working site.
#
# Without this, a branch-served site loads index.html, fails to find vendor/bundle.js,
# and every button silently does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - name: Commit the built files back to main
        run: |
          cp dist/vendor/bundle.js vendor/bundle.js
          cp dist/wasm-zstd.wasm wasm-zstd.wasm
          cp dist/sw.js sw.js
          cp dist/manifest.webmanifest manifest.webmanifest
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These are gitignored for local work, so force-add them here.
          git add -f vendor/bundle.js wasm-zstd.wasm sw.js manifest.webmanifest .nojekyll
          if git diff --cached --quiet; then
            echo "built files unchanged"
          else
            # [skip ci] stops this commit triggering another run.
            git commit -m "Build the published files [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

  deploy:
    # Only does anything when Pages is set to "GitHub Actions"; harmless otherwise.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
