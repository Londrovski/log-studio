<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TBRe Log Studio — capability test</title>
<style>
 :root{--blue:#105bab;--ora:#E6642A;--ink:#18181b;--mut:#71717a;--line:#e4e4e7}
 *{box-sizing:border-box} body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:#fff}
 header{padding:22px 28px;border-bottom:1px solid var(--line)} h1{margin:0;font-size:22px} h1 b{color:var(--blue)}
 p.sub{margin:6px 0 0;color:var(--mut);font-size:14px}
 main{padding:24px 28px;max-width:1100px}
 .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
 button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 20px;background:var(--blue);color:#fff;cursor:pointer}
 button.ghost{background:#f4f4f5;color:var(--ink)} button:disabled{opacity:.45;cursor:default}
 table{border-collapse:collapse;width:100%;font-size:14px} td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
 th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
 .ok{color:#15803d;font-weight:700} .bad{color:#b91c1c;font-weight:700} .warn{color:#b45309;font-weight:700}
 #files{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;display:none}
 #files tr{cursor:pointer} #files tr:hover{background:#fafafa}
 canvas{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:10px;display:none}
 .note{font-size:13px;color:var(--mut)} code{background:#f4f4f5;padding:1px 5px;border-radius:5px;font-size:13px}
 #log{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:18px;max-height:240px;overflow:auto}
</style></head><body>
<header>
  <h1><b>TBRe</b> Log Studio — capability test</h1>
  <p class="sub">Checks whether this browser can do everything the viewer needs, using one of your real logs. Nothing is uploaded.</p>
</header>
<main>
  <div class="row">
    <button id="pick">Choose logs folder</button>
    <button id="pickFile" class="ghost">Or choose a single .mcap</button>
    <input id="fileInput" type="file" accept=".mcap" hidden>
    <span class="note">Needs Chrome or Edge. Pick the folder that holds Sorted/ and Raw/ — sub-folders are searched too.</span>
  </div>
  <table id="files"><tbody></tbody></table>
  <table id="results"><thead><tr><th style="width:230px">Check</th><th style="width:90px">Result</th><th>Detail</th></tr></thead><tbody></tbody></table>
  <canvas id="cam"></canvas>
  <div class="row" style="margin-top:18px"><button id="enc">Test MP4 export (2 s clip)</button><span id="encNote" class="note"></span></div>
  <div id="log"></div>
</main>
<script type="module">
const R=document.querySelector("#results tbody"), LOG=document.getElementById("log");
const log=(m)=>{LOG.textContent+=m+"\n";LOG.scrollTop=LOG.scrollHeight;};
const rows={};
function row(name,state,detail=""){
  let tr=rows[name];
  if(!tr){tr=document.createElement("tr");tr.innerHTML="<td></td><td></td><td></td>";R.appendChild(tr);rows[name]=tr;}
  tr.children[0].textContent=name;
  tr.children[1].innerHTML=state==="ok"?'<span class="ok">PASS</span>':state==="bad"?'<span class="bad">FAIL</span>':state==="warn"?'<span class="warn">PART</span>':"…";
  tr.children[2].textContent=detail;
}
row("Browser basics", isSecureContext?"ok":"bad", `secure context: ${isSecureContext} · folder picker: ${typeof window.showDirectoryPicker} · video encoder: ${typeof window.VideoEncoder} · page origin: ${location.protocol}`);

let mcapLib=null, protobufLib=null;
async function libs(){
  if(mcapLib) return;
  row("Load libraries from the web","...","fetching @mcap/core and protobufjs from jsDelivr");
  try{
    mcapLib=await import("https://cdn.jsdelivr.net/npm/@mcap/core@2.1.7/+esm");
    protobufLib=(await import("https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/+esm")).default;
    row("Load libraries from the web","ok","@mcap/core + protobufjs loaded");
  }catch(e){ row("Load libraries from the web","bad",String(e)); throw e; }
}
// A File read as MCAP wants random access; this is the adapter.
const readableFromFile=(file)=>({
  size: async()=>BigInt(file.size),
  read: async(offset,length)=>new Uint8Array(await file.slice(Number(offset),Number(offset+length)).arrayBuffer()),
});
function sanitize(fd){ // proto3 forbids `required`; Foxglove SDK schemas have it, so relax it
  const walk=(mt)=>{ (mt.field||[]).forEach(f=>{ if(f.label===2) f.label=1; }); (mt.nestedType||mt.nested_type||[]).forEach(walk); };
  (fd.messageType||fd.message_type||[]).forEach(walk); return fd;
}
let picked=null;
async function openFile(file){
  picked=file; LOG.textContent="";
  log(`opening ${file.name} (${(file.size/1048576).toFixed(1)} MB)`);
  await libs();
  let reader, summary;
  const t0=performance.now();
  try{
    reader=await mcapLib.McapIndexedReader.Initialize({readable:readableFromFile(file)});
    const st=reader.statistics;
    const chans=[...reader.channelsById.values()];
    const start=Number(st.messageStartTime)/1e9, end=Number(st.messageEndTime)/1e9;
    row("Read the log's index","ok",`${chans.length} topics · ${st.messageCount.toLocaleString()} messages · ${(end-start).toFixed(1)} s · index read in ${Math.round(performance.now()-t0)} ms`);
    log(`topics: ${chans.map(c=>c.topic).slice(0,6).join(", ")}…`);
    summary={reader,chans,start,end};
  }catch(e){ row("Read the log's index","bad",String(e)); return; }
  // decode a scene message with the required-field workaround
  const {reader:rd,chans,start}=summary;
  const sceneTopic=chans.find(c=>c.topic==="/graph_slam/landmarks")||chans.find(c=>c.schemaId&&c.messageEncoding==="protobuf");
  try{
    const t1=performance.now();
    let done=false;
    for await (const msg of rd.readMessages({topics:[sceneTopic.topic],startTime:BigInt(Math.round((start+2)*1e9))})){
      const schema=rd.schemasById.get(msg.schemaId||sceneTopic.schemaId);
      const descriptorNs=await import("https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/ext/descriptor/+esm");
      const FileDescriptorSet=(descriptorNs.default||descriptorNs).FileDescriptorSet
        || protobufLib.Root.fromJSON((descriptorNs.default||descriptorNs)).lookupType("google.protobuf.FileDescriptorSet");
      const parsedSet=FileDescriptorSet.decode(schema.data).toJSON();
      (parsedSet.file||[]).forEach(sanitize);
      const built=protobufLib.Root.fromDescriptor(FileDescriptorSet.fromObject(parsedSet));
      const Msg=built.lookupType(schema.name);
      const obj=Msg.decode(msg.data);
      const n=(obj.entities&&obj.entities[0]&&(obj.entities[0].cubes||[]).length)||0;
      row("Decode Foxglove protobuf (the required-field problem)","ok",`${schema.name} decoded in ${Math.round(performance.now()-t1)} ms · ${n} cones in that message`);
      done=true; break;
    }
    if(!done) row("Decode Foxglove protobuf (the required-field problem)","warn","no messages found on that topic");
  }catch(e){ row("Decode Foxglove protobuf (the required-field problem)","bad",String(e)); log(String(e&&e.stack||e)); }
  // camera frame
  try{
    const t2=performance.now(); let shown=false;
    for await (const msg of rd.readMessages({topics:["/perception/sensor_fusion_image"],startTime:BigInt(Math.round((start+5)*1e9))})){
      const bytes=msg.data; let i=bytes.indexOf(0xFF); while(i>=0 && bytes[i+1]!==0xD8) i=bytes.indexOf(0xFF,i+1);
      const jpeg=new Blob([bytes.slice(i)],{type:"image/jpeg"});
      const bmp=await createImageBitmap(jpeg);
      const c=document.getElementById("cam"); c.width=bmp.width; c.height=bmp.height; c.style.display="block";
      c.getContext("2d").drawImage(bmp,0,0);
      row("Decode and draw a camera frame","ok",`${bmp.width}×${bmp.height} in ${Math.round(performance.now()-t2)} ms`);
      shown=true; break;
    }
    if(!shown) row("Decode and draw a camera frame","warn","no camera frames in this log");
  }catch(e){ row("Decode and draw a camera frame","bad",String(e)); }
}
document.getElementById("pick").onclick=async()=>{
  try{
    const dir=await window.showDirectoryPicker();
    row("Open a folder from this machine","ok",`folder "${dir.name}" opened`);
    const tb=document.querySelector("#files tbody"); tb.innerHTML=""; document.getElementById("files").style.display="block";
    row("List the logs in that folder","...","scanning, including sub-folders…");
    const found=[];
    async function scan(handle,prefix,depth){
      if(depth>4) return;
      for await (const [name,h] of handle.entries()){
        if(h.kind==="file"){ if(name.toLowerCase().endsWith(".mcap")) found.push({path:prefix+name,handle:h}); }
        else if(h.kind==="directory"){ await scan(h,prefix+name+"/",depth+1); }
        if(found.length>800) return;
      }
    }
    await scan(dir,"",0);
    found.sort((a,b)=>a.path.localeCompare(b.path));
    for(const f of found){
      const file=await f.handle.getFile();
      const tr=document.createElement("tr");
      tr.innerHTML=`<td>${f.path}</td><td style="width:120px">${(file.size/1048576).toFixed(1)} MB</td>`;
      tr.onclick=()=>openFile(file); tb.appendChild(tr);
    }
    row("List the logs in that folder",found.length?"ok":"warn",
      found.length?`${found.length} .mcap files found (sub-folders included) — click one to test it`
                  :"no .mcap files anywhere under that folder — pick the folder that contains Sorted/ and Raw/");
  }catch(e){ row("Open a folder from this machine", e.name==="AbortError"?"warn":"bad", String(e.message||e)); }
};
document.getElementById("pickFile").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=(e)=>{ const f=e.target.files[0]; if(f){ row("Open a folder from this machine","warn","single file chosen instead of a folder"); openFile(f);} };
document.getElementById("enc").onclick=async()=>{
  const note=document.getElementById("encNote"); note.textContent="encoding…";
  try{
    const muxer=await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/+esm");
    const W=1280,H=720,FPS=30,SECS=2;
    const target=new muxer.ArrayBufferTarget();
    const mux=new muxer.Muxer({target,video:{codec:"avc",width:W,height:H},fastStart:"in-memory"});
    const enc=new VideoEncoder({output:(chunk,meta)=>mux.addVideoChunk(chunk,meta),error:(e)=>{throw e;}});
    enc.configure({codec:"avc1.42001f",width:W,height:H,bitrate:4e6,framerate:FPS});
    const c=new OffscreenCanvas(W,H), ctx=c.getContext("2d");
    const t0=performance.now();
    for(let i=0;i<FPS*SECS;i++){
      ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#105bab";ctx.font="bold 64px Segoe UI";ctx.fillText("TBReAI test frame "+(i+1),60,120);
      ctx.fillStyle="#E6642A";ctx.fillRect(60,200+((i*12)%400),300,80);
      const frame=new VideoFrame(c,{timestamp:i*1e6/FPS,duration:1e6/FPS});
      enc.encode(frame,{keyFrame:i%30===0}); frame.close();
      if(enc.encodeQueueSize>10) await new Promise(r=>setTimeout(r,5));
    }
    await enc.flush(); mux.finalize();
    const ms=Math.round(performance.now()-t0);
    const blob=new Blob([target.buffer],{type:"video/mp4"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tbre-encoder-test.mp4"; a.click();
    row("Make an MP4 in the browser","ok",`${FPS*SECS} frames at ${W}×${H} in ${ms} ms (${Math.round(FPS*SECS/(ms/1000))} fps) · file downloaded`);
    note.textContent="done — check your downloads for tbre-encoder-test.mp4";
  }catch(e){ row("Make an MP4 in the browser","bad",String(e)); note.textContent=""; }
};
</script>
</body></html>
