<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBRe Log Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#105bab">
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><b>TBRe</b><span>Log Studio</span><small id="ver"></small></div>
    <div class="pad row">
      <button id="pick">Choose logs folder</button>
      <button id="pickFile" class="ghost">Single file</button>
      <input id="fileInput" type="file" accept=".mcap" hidden>
    </div>
    <div class="pad row spread" style="padding-top:0">
      <label class="field" style="flex:1">Template
        <select id="template"></select>
      </label>
      <label class="field" style="flex:1">Mission
        <select id="mission"><option value="">All</option></select>
      </label>
    </div>
    <div class="pad hint" id="folderNote" style="padding-top:0">No folder chosen yet. Your logs never leave this machine.</div>
    <div class="bar"><div id="progress"></div></div>
    <div id="runs"></div>
  </aside>

  <main>
    <div class="stage">
      <canvas id="view" width="1920" height="1080"></canvas>
      <div class="empty" id="empty">
        <h2>Pick your logs folder to begin</h2>
        <p>Every <code>.mcap</code> under it is listed, including sub-folders. Choose a run to watch it, set an in and out point, and render an MP4 in whichever template you like.</p>
      </div>
    </div>

    <div class="transport" id="transport" hidden>
      <div class="scrub">
        <div class="marks" id="marks"><div class="drv" id="markDrive"></div><div class="sel" id="markSel"></div></div>
        <input id="seek" type="range" min="0" max="1000" value="0">
      </div>
      <div class="times"><span id="tNow">0:00.0</span><span id="tTitle"></span><span id="tEnd">0:00.0</span></div>
      <div class="row spread">
        <div class="row">
          <button id="play">Play</button>
          <button class="ghost" id="stepBack">&minus;1 frame</button>
          <button class="ghost" id="stepFwd">+1 frame</button>
          <label class="field">Speed
            <select id="rate">
              <option value="0.25">0.25&times;</option><option value="0.5">0.5&times;</option>
              <option value="1" selected>1&times;</option><option value="2">2&times;</option><option value="4">4&times;</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button class="ghost" id="setIn">Set in</button>
          <button class="ghost" id="setOut">Set out</button>
          <button class="quiet" id="clearSel">Whole run</button>
          <span class="hint" id="clipNote"></span>
        </div>
      </div>
      <div class="row spread">
        <div class="row">
          <label class="field">Render speed
            <select id="renderSpeed">
              <option value="0.5">0.5&times;</option><option value="1" selected>1&times;</option>
              <option value="2">2&times;</option><option value="4">4&times;</option>
            </select>
          </label>
          <label class="field">Size
            <select id="renderScale"><option value="1" selected>Full</option><option value="0.6667">720p-ish</option></select>
          </label>
          <label class="field">Quality
            <select id="renderQuality">
              <option value="web" selected>Web (small)</option>
              <option value="medium">Medium</option>
              <option value="high">High (master)</option>
            </select>
          </label>
        </div>
        <div class="row">
          <button id="render">Render MP4</button>
          <button class="ghost" id="queue">Add to batch</button>
          <button class="ghost" id="openBatch">Batch (0)</button>
        </div>
      </div>
    </div>
    <div class="jobs" id="jobs"></div>
  </main>
</div>
<script type="module" src="src/main.js"></script>
<script>
  // Installing the app is what makes it work with no internet, which is the point in a
  // paddock. Harmless when it isn't available (opening the file straight off disk).
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
